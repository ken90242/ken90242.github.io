<svg viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg" font-family="monospace" font-size="13">
  <!-- ============================ BINARY ============================ -->
  <text x="120" y="22" text-anchor="middle" fill="#1a1a1a" font-weight="bold">binary tree</text>

  <!-- static faint tree (edges meet circle borders, no poking) -->
  <g stroke="#c4ccd6" stroke-width="1.5">
    <line x1="115.7" y1="46.8" x2="100.3" y2="71.2"/>
    <line x1="125"   y1="46.3" x2="145"   y2="71.7"/>
    <line x1="98.5"  y1="85.6" x2="105.5" y2="106.4"/>
  </g>
  <circle cx="120" cy="40"  r="8" fill="#f5f5f5" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="96"  cy="78"  r="8" fill="#f5f5f5" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="150" cy="78"  r="8" fill="#f5f5f5" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="108" cy="114" r="8" fill="#f5f5f5" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- highlighted edges (drawn UNDER the circles so nothing pokes out) -->
  <line x1="115.7" y1="46.8" x2="100.3" y2="71.2" stroke="#0b5fa5" stroke-width="2" opacity="0">
    <animate attributeName="opacity" dur="5s" repeatCount="indefinite" keyTimes="0;0.10;0.16;0.92;1" values="0;0;1;1;0"/></line>
  <line x1="98.5" y1="85.6" x2="105.5" y2="106.4" stroke="#0b5fa5" stroke-width="2" opacity="0">
    <animate attributeName="opacity" dur="5s" repeatCount="indefinite" keyTimes="0;0.22;0.28;0.92;1" values="0;0;1;1;0"/></line>
  <line x1="108" y1="122" x2="108" y2="202" stroke="#b03a2e" stroke-width="2" stroke-dasharray="3 5" opacity="0">
    <animate attributeName="opacity" dur="5s" repeatCount="indefinite" keyTimes="0;0.34;0.40;0.92;1" values="0;0;1;1;0"/></line>

  <!-- highlighted nodes ON TOP -->
  <g>
    <circle cx="120" cy="40" r="8" fill="#eaf2fa" stroke="#0b5fa5" stroke-width="2" opacity="0">
      <animate attributeName="opacity" dur="5s" repeatCount="indefinite" keyTimes="0;0.04;0.10;0.92;1" values="0;0;1;1;0"/></circle>
    <circle cx="96" cy="78" r="8" fill="#eaf2fa" stroke="#0b5fa5" stroke-width="2" opacity="0">
      <animate attributeName="opacity" dur="5s" repeatCount="indefinite" keyTimes="0;0.16;0.22;0.92;1" values="0;0;1;1;0"/></circle>
    <circle cx="108" cy="114" r="8" fill="#eaf2fa" stroke="#0b5fa5" stroke-width="2" opacity="0">
      <animate attributeName="opacity" dur="5s" repeatCount="indefinite" keyTimes="0;0.28;0.34;0.92;1" values="0;0;1;1;0"/></circle>
    <circle cx="108" cy="210" r="8" fill="#f7eae8" stroke="#b03a2e" stroke-width="2" opacity="0">
      <animate attributeName="opacity" dur="5s" repeatCount="indefinite" keyTimes="0;0.62;0.68;0.92;1" values="0;0;1;1;0"/></circle>
  </g>
  <text x="150" y="168" fill="#b03a2e" font-size="11" opacity="0">levels 3 &#8230; 20
    <animate attributeName="opacity" dur="5s" repeatCount="indefinite" keyTimes="0;0.40;0.46;0.92;1" values="0;0;1;1;0"/></text>

  <!-- I/O tally bar: steps up once per level, all the way to ~20 -->
  <text x="248" y="40" text-anchor="middle" fill="#555" font-size="11">disk reads</text>
  <rect x="239" y="52" width="18" height="160" fill="none" stroke="#e0c4bf" stroke-width="1"/>
  <rect x="239" width="18" fill="#b03a2e" fill-opacity="0.85">
    <animate attributeName="height" dur="5s" repeatCount="indefinite" calcMode="discrete"
      keyTimes="0;0.04;0.10;0.16;0.22;0.28;0.34;0.40;0.44;0.48;0.52;0.56;0.60;0.64;0.68;0.72;0.76;0.80;0.84;0.88;0.92;1"
      values="0;8;16;24;32;40;48;56;64;72;80;88;96;104;112;120;128;136;144;152;160;160"/>
    <animate attributeName="y" dur="5s" repeatCount="indefinite" calcMode="discrete"
      keyTimes="0;0.04;0.10;0.16;0.22;0.28;0.34;0.40;0.44;0.48;0.52;0.56;0.60;0.64;0.68;0.72;0.76;0.80;0.84;0.88;0.92;1"
      values="212;204;196;188;180;172;164;156;148;140;132;124;116;108;100;92;84;76;68;60;52;52"/>
  </rect>
  <text x="248" y="234" text-anchor="middle" fill="#b03a2e" font-weight="bold">~20</text>

  <!-- divider -->
  <line x1="350" y1="30" x2="350" y2="240" stroke="#e4e8ee" stroke-width="1" stroke-dasharray="3 4"/>

  <!-- ============================ B-TREE ============================ -->
  <text x="500" y="22" text-anchor="middle" fill="#1a1a1a" font-weight="bold">B-Tree (n-way) &#8212; node = block</text>

  <!-- static faint tree -->
  <g stroke="#c4ccd6" stroke-width="1.5">
    <line x1="500" y1="58" x2="500" y2="80"/>
    <line x1="500" y1="100" x2="478" y2="140"/>
  </g>
  <rect x="462" y="38"  width="76" height="20" rx="3" fill="#f5f5f5" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="500" y="52" text-anchor="middle" font-size="11">30|60|90</text>
  <rect x="466" y="80"  width="68" height="20" rx="3" fill="#f5f5f5" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="500" y="94" text-anchor="middle" font-size="11">41|48|55</text>
  <rect x="446" y="140" width="64" height="20" rx="3" fill="#f5f5f5" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="478" y="154" text-anchor="middle" font-size="11">42|45|47</text>

  <!-- highlighted path -->
  <rect x="462" y="38" width="76" height="20" rx="3" fill="#eaf2fa" stroke="#0b5fa5" stroke-width="2" opacity="0">
    <animate attributeName="opacity" dur="5s" repeatCount="indefinite" keyTimes="0;0.04;0.10;0.92;1" values="0;0;1;1;0"/></rect>
  <line x1="500" y1="58" x2="500" y2="80" stroke="#0b5fa5" stroke-width="2" opacity="0">
    <animate attributeName="opacity" dur="5s" repeatCount="indefinite" keyTimes="0;0.12;0.18;0.92;1" values="0;0;1;1;0"/></line>
  <rect x="466" y="80" width="68" height="20" rx="3" fill="#eaf2fa" stroke="#0b5fa5" stroke-width="2" opacity="0">
    <animate attributeName="opacity" dur="5s" repeatCount="indefinite" keyTimes="0;0.18;0.24;0.92;1" values="0;0;1;1;0"/></rect>
  <line x1="500" y1="100" x2="478" y2="140" stroke="#0b5fa5" stroke-width="2" opacity="0">
    <animate attributeName="opacity" dur="5s" repeatCount="indefinite" keyTimes="0;0.24;0.30;0.92;1" values="0;0;1;1;0"/></line>
  <rect x="446" y="140" width="64" height="20" rx="3" fill="#eaf2fa" stroke="#0b5fa5" stroke-width="2" opacity="0">
    <animate attributeName="opacity" dur="5s" repeatCount="indefinite" keyTimes="0;0.30;0.36;0.92;1" values="0;0;1;1;0"/></rect>
  <text x="500" y="178" text-anchor="middle" fill="#0b5fa5" font-size="11" opacity="0">bottom reached
    <animate attributeName="opacity" dur="5s" repeatCount="indefinite" keyTimes="0;0.40;0.46;0.92;1" values="0;0;1;1;0"/></text>

  <!-- I/O tally bar: same frame as the binary side, only ~4 steps -->
  <text x="600" y="40" text-anchor="middle" fill="#555" font-size="11">disk reads</text>
  <rect x="591" y="52" width="18" height="160" fill="none" stroke="#bcd2ea" stroke-width="1"/>
  <rect x="591" width="18" fill="#0b5fa5" fill-opacity="0.85">
    <animate attributeName="height" dur="5s" repeatCount="indefinite" calcMode="discrete"
      keyTimes="0;0.10;0.24;0.36;0.46;0.92;1" values="0;8;16;24;32;32;32"/>
    <animate attributeName="y" dur="5s" repeatCount="indefinite" calcMode="discrete"
      keyTimes="0;0.10;0.24;0.36;0.46;0.92;1" values="212;204;196;188;180;180;180"/>
  </rect>
  <text x="600" y="234" text-anchor="middle" fill="#0b5fa5" font-weight="bold">~4</text>

  <!-- ============================ caption ============================ -->
  <line x1="10" y1="250" x2="670" y2="250" stroke="#e4e8ee" stroke-width="1"/>
  <text x="10" y="268" fill="#555">Each step down the tree = one disk read.</text>
  <text x="10" y="284" fill="#b03a2e">Binary tree: ~20 levels deep &#8594; ~20 reads.</text>
  <text x="10" y="300" fill="#0b5fa5">B-Tree: one block per level &#8594; only ~3&#8211;4 reads.</text>
</svg>
