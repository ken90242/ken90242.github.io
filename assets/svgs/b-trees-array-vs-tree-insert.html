<svg viewBox="0 0 680 232" xmlns="http://www.w3.org/2000/svg" font-family="monospace" font-size="13">
  <defs><marker id="sh" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
    <path d="M0,0 L7,3 L0,6 Z" fill="#b03a2e"/></marker></defs>

  <!-- ===================== array insert ===================== -->
  <text x="10" y="24" fill="#1a1a1a" font-weight="bold">sorted array: insert 22</text>
  <!-- fixed cell 20 -->
  <g>
    <rect x="10" y="34" width="48" height="38" rx="3" fill="#f5f5f5" stroke="#1a1a1a" stroke-width="1.5"/>
    <text x="34" y="58" text-anchor="middle">20</text>
  </g>
  <!-- tail cells 23,24,25 slide one slot to the right -->
  <g>
    <animateTransform attributeName="transform" type="translate" dur="3.4s" repeatCount="indefinite"
      keyTimes="0;0.30;0.55;0.85;1" values="0,0; 0,0; 50,0; 50,0; 0,0" calcMode="spline"
      keySplines="0 0 1 1; .4 0 .2 1; 0 0 1 1; .4 0 .2 1"/>
    <rect x="60"  y="34" width="48" height="38" rx="3" fill="#f7eae8" stroke="#b03a2e" stroke-width="1.5"/>
    <rect x="110" y="34" width="48" height="38" rx="3" fill="#f7eae8" stroke="#b03a2e" stroke-width="1.5"/>
    <rect x="160" y="34" width="48" height="38" rx="3" fill="#f7eae8" stroke="#b03a2e" stroke-width="1.5"/>
    <text x="84"  y="58" text-anchor="middle">23</text>
    <text x="134" y="58" text-anchor="middle">24</text>
    <text x="184" y="58" text-anchor="middle">25</text>
  </g>
  <!-- the inserted 22 appears in the gap that opens up -->
  <g opacity="0">
    <animate attributeName="opacity" dur="3.4s" repeatCount="indefinite" keyTimes="0;0.55;0.62;0.85;1" values="0;0;1;1;0"/>
    <rect x="60" y="34" width="48" height="38" rx="3" fill="#eaf2fa" stroke="#0b5fa5" stroke-width="2"/>
    <text x="84" y="58" text-anchor="middle" fill="#0b5fa5">22</text>
  </g>
  <!-- shift arrow -->
  <line x1="112" y1="86" x2="258" y2="86" stroke="#b03a2e" stroke-width="1.5" marker-end="url(#sh)">
    <animate attributeName="opacity" dur="3.4s" repeatCount="indefinite" keyTimes="0;0.30;0.55;0.85;1" values="0;0;1;1;0"/>
  </line>
  <text x="10" y="104" fill="#b03a2e">every later element shifts right &#8212; O(N) writes</text>

  <!-- ===================== tree insert ===================== -->
  <text x="10" y="150" fill="#1a1a1a" font-weight="bold">tree: insert 22</text>
  <line x1="120" y1="170" x2="80" y2="186" stroke="#c4ccd6" stroke-width="1.5"/>
  <circle cx="120" cy="166" r="11" fill="#f5f5f5" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="120" y="170" text-anchor="middle" font-size="11">23</text>
  <circle cx="80" cy="190" r="11" fill="#f5f5f5" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="80" y="194" text-anchor="middle" font-size="11">20</text>
  <!-- only the new node + its edge fade in; nothing else moves -->
  <g opacity="0">
    <animate attributeName="opacity" dur="3.4s" repeatCount="indefinite" keyTimes="0;0.45;0.62;0.9;1" values="0;0;1;1;1"/>
    <line x1="130" y1="173" x2="160" y2="186" stroke="#0b5fa5" stroke-width="1.5"/>
    <circle cx="160" cy="190" r="11" fill="#eaf2fa" stroke="#0b5fa5" stroke-width="2"/>
    <text x="160" y="194" text-anchor="middle" font-size="11" fill="#0b5fa5">22</text>
  </g>
  <text x="200" y="190" fill="#0b5fa5">only a local node changes &#8212; O(log N)</text>

  <!-- ===================== bottom caption ===================== -->
  <line x1="10" y1="208" x2="670" y2="208" stroke="#e4e8ee" stroke-width="1"/>
  <text x="10" y="228" fill="#555">keeping an array ordered means moving data on every write; a tree edits one spot and leaves the rest untouched.</text>
</svg>
